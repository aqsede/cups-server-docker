services:
  cups:
    build: .
    image: cups-ipp-usb:local
    container_name: cups_server
    restart: unless-stopped

    # Host networking is required so avahi/CUPS can advertise the shared
    # printer via mDNS/Bonjour on your actual LAN, not an isolated docker
    # bridge network.
    network_mode: host

    # Give the container access to the USB bus without full --privileged.
    # 189 is the Linux "usb" device major number.
    device_cgroup_rules:
      - 'c 189:* rmw'

    environment:
      - CUPS_ADMIN_USER=${CUPS_ADMIN_USER:-admin}
      - CUPS_ADMIN_PASSWORD=${CUPS_ADMIN_PASSWORD:-change_me_please}
      - TZ=${TZ:-UTC}
      - WATCHDOG_INTERVAL=${WATCHDOG_INTERVAL:-20}

    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./data/cups-config:/etc/cups
      - ./data/cups-spool:/var/spool/cups
      - ./data/ipp-usb-conf:/etc/ipp-usb
      - ./data/ipp-usb-state:/var/ipp-usb

    # Logs live in RAM, not on disk: nothing here ever triggers a drive
    # spin-up/D3 exit, and logs simply reset on container restart.
    tmpfs:
      - /var/log/cups:size=16m
      - /var/log/ipp-usb:size=16m