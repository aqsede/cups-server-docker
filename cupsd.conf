# cupsd.conf for the Brother T220 print server container.
# Based on Debian's default, modified to:
#  - listen on all interfaces (not just localhost)
#  - allow admin/printing access from your LAN
#  - enable sharing + mDNS/Bonjour browsing so the printer is discoverable

LogLevel warn
PageLogFormat
MaxLogSize 0
ErrorPolicy retry-job

# Skip the high-frequency, low-value logs (every web hit, every page).
# ErrorLog (warnings/failures only) is left at its default location, which
# is mounted as tmpfs below - so nothing here touches physical disk anyway.
AccessLog /dev/null
PageLog /dev/null

Listen *:631
Listen /run/cups/cups.sock

# Advertise shared printers over mDNS/Bonjour (via avahi-daemon)
Browsing On
BrowseLocalProtocols dnssd

WebInterface Yes
DefaultAuthType Basic
DefaultEncryption IfRequested

# --- Access control -------------------------------------------------------
# "Allow all" is fine on a trusted home LAN. If you want to lock this down,
# replace "Allow all" below with your subnet, e.g. "Allow 192.168.1.0/24"
<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

# --- Policies (standard CUPS defaults) ------------------------------------
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>

<Policy authenticated>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    AuthType Default
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>